name: rehabcrm-production-reference

services:
  postgres:
    image: postgres:16.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:?required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ['sh', '-c', 'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a $$REDIS_PASSWORD ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
    networks: [backend]

  api:
    image: ${REHABCRM_API_IMAGE:?immutable image digest required}
    restart: unless-stopped
    env_file: ${REHABCRM_ENV_FILE:?absolute secret env file required}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [backend]

  web:
    image: ${REHABCRM_WEB_IMAGE:?immutable image digest required}
    restart: unless-stopped
    env_file: ${REHABCRM_ENV_FILE:?absolute secret env file required}
    depends_on: [api]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [backend, edge]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      REHABCRM_HOSTNAME: ${REHABCRM_HOSTNAME:?required}
    ports: ['80:80', '443:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
    security_opt: [no-new-privileges:true]
    networks: [edge]

networks:
  backend:
    internal: true
  edge:

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
